            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', '"Noto Sans TC"', 'sans-serif'],

                        toy: {

    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFE8D6;
            font-family: 'Noto Sans TC', sans-serif;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Toy-like 3D button style */
        .toy-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 0 rgba(7, 59, 76, 0.2), 0 8px 15px rgba(0,0,0,0.1);
            border: 2px solid #073B4C;
        }
        .toy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(7, 59, 76, 0.2), 0 2px 5px rgba(0,0,0,0.1);
        }
        .toy-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border: 3px solid #073B4C;
            box-shadow: 0 10px 0 rgba(7, 59, 76, 0.18), 0 20px 30px rgba(0,0,0,0.15);
        }
        .toy-badge {
            border: 2px solid #073B4C;
            box-shadow: 0 3px 0 #073B4C;
        }
        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #FFF3E6;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #FFB599;
            border-radius: 8px;
            border: 2px solid #FFF3E6;
        }
        /* Floating 3D labels */
        .island-label {
            position: absolute;
            transform: translate(-50%, -100%);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            z-index: 10;
        }
        .island-label:hover {
            transform: translate(-50%, -110%) scale(1.08);
            z-index: 20;
        }
        /* Triangle SVG interactive hover */
        .tri-zone {
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .tri-zone:hover {
            filter: brightness(1.08);
            transform: scale(1.03);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

                cloud.position.set(Math.cos(angle) * dist, 5.5 + Math.random() * 2.5, Math.sin(angle) * dist);
                scene.add(cloud);
                clouds.push({ mesh: cloud, angle, dist, speed: 0.001 + Math.random() * 0.0015, baseY: cloud.position.y });
            }

            // Create HTML Floating Badges for each Island
            createHTMLIslandLabels();

            // Raycaster & Input Listeners
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            setupInteractionListeners(renderer.domElement);
            window.addEventListener('resize', onWindowResize);

            // Adjust initial camera distance for mobile screens
            if (window.innerWidth < 768) {
                camState.radius = 36;
                camState.desiredRadius = 36;
            }
        }

        // Helper: Toy Plastic Material
        function toyMat(colorHex, roughness = 0.35) {
            return new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: roughness,
                metalness: 0.05
            });
        }

        // Create Wooden Toy Bridge between islands
        function createToyBridge(x1, z1, x2, z2) {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const dist = Math.sqrt(dx * dx + dz * dz);
            const angle = Math.atan2(dx, dz);

            const bridgeGroup = new THREE.Group();
            const steps = 7;
            for (let i = 2; i <= steps - 2; i++) {
                const t = i / steps;
                const plankGeo = new THREE.BoxGeometry(1.6, 0.22, 0.65);
                const plank = new THREE.Mesh(plankGeo, toyMat(0xDEB887, 0.5));
                plank.position.set(0, -0.35 + Math.sin(t * Math.PI) * 0.35, (t - 0.5) * dist);
                plank.castShadow = true;
                plank.receiveShadow = true;
                bridgeGroup.add(plank);
            }
            bridgeGroup.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
            bridgeGroup.rotation.y = angle;
            scene.add(bridgeGroup);
        }

        // Create a Hexagonal Toy Island with unique 3D miniature props
        function createHexIsland(islData) {
            const group = new THREE.Group();
            group.position.set(islData.pos.x, 0, islData.pos.z);
            group.userData = { islandId: islData.id };

            const baseGeo = new THREE.CylinderGeometry(4.2, 3.6, 2.2, 6);
            const baseMesh = new THREE.Mesh(baseGeo, toyMat(0xF4A261, 0.5));
            baseMesh.position.y = -1.1;
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            baseMesh.userData = { islandId: islData.id };
            group.add(baseMesh);
            clickableMeshes.push(baseMesh);

            // 2. Top Pastel Grass / Theme Cap Hexagon
            const capGeo = new THREE.CylinderGeometry(4.35, 4.2, 0.55, 6);
            const capMesh = new THREE.Mesh(capGeo, toyMat(islData.colorHex, 0.3));
            capMesh.position.y = 0.25;
            capMesh.castShadow = true;
            capMesh.receiveShadow = true;
            capMesh.userData = { islandId: islData.id };
            group.add(capMesh);
            clickableMeshes.push(capMesh);

            // 3. Inner Cream Stage Platform
            const innerGeo = new THREE.CylinderGeometry(3.2, 3.3, 0.2, 6);
            const innerMesh = new THREE.Mesh(innerGeo, toyMat(0xFFFDF9, 0.4));
            innerMesh.position.y = 0.6;
            innerMesh.receiveShadow = true;
            innerMesh.userData = { islandId: islData.id };
            group.add(innerMesh);
            clickableMeshes.push(innerMesh);

            // 4. Add Toy Trees around the edge
            const treePositions = [
                { x: -2.4, z: -1.6 },
                { x: 2.5, z: -1.4 },
                { x: -2.2, z: 1.8 }
            ];
            treePositions.forEach((tp, idx) => {
                const tree = createToyTree(idx % 2 === 0 ? 0x06D6A0 : 0x52B788);
                tree.position.set(tp.x, 0.65, tp.z);
                tree.scale.setScalar(0.75 + (idx * 0.1));
                group.add(tree);
            });

            // 5. Add Unique Miniature Landmark per Island
            const landmark = buildIslandLandmark(islData.id);
            landmark.position.y = 0.7;
            group.add(landmark);

            scene.add(group);
            islandGroups.push({ id: islData.id, group, capMesh, baseY: 0 });
        }

                const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.4, 2.0, 8), toyMat(0x073B4C));

                const podium = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.3, 0.9, 6), toyMat(0xFFFFFF));
                podium.position.y = 0.45;
                podium.castShadow = true;
                propGroup.add(podium);

                const trophy = new THREE.Mesh(new THREE.OctahedronGeometry(0.85, 0), toyMat(0xFFD166, 0.15));

        function updateHTMLIslandLabels() {
            ISLANDS_DATA.forEach(isl => {
                const el = document.getElementById(`island-label-${isl.id}`);
                if (!el) return;
                const worldPos = new THREE.Vector3(isl.pos.x, 3.6, isl.pos.z);
                worldPos.project(camera);

                if (worldPos.z > 1) {
                    el.style.display = 'none';
                    return;
                }
                const x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(worldPos.y * 0.5) + 0.5) * window.innerHeight;
                el.style.display = 'block';
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
            });
        }

        // Mouse & Touch Orbit + Click Raycasting
        function setupInteractionListeners(domElement) {
            domElement.addEventListener('pointerdown', (e) => {
                isDragging = true;
                pointerDownPos = { x: e.clientX, y: e.clientY };
                previousPointerPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - previousPointerPos.x;
                const dy = e.clientY - previousPointerPos.y;
                previousPointerPos = { x: e.clientX, y: e.clientY };

                camState.desiredTheta -= dx * 0.007;
                camState.desiredPhi = Math.max(0.35, Math.min(1.35, camState.desiredPhi - dy * 0.006));
            });

            window.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (moveDist < 6) {
                    handleCanvasTap(e.clientX, e.clientY);
                }
            });

            domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camState.desiredRadius = Math.max(14, Math.min(48, camState.desiredRadius + e.deltaY * 0.02));
            }, { passive: false });
        }

        function handleCanvasTap(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(clickableMeshes, false);
            if (intersects.length > 0) {
                const hitIslandId = intersects[0].object.userData.islandId;
                if (hitIslandId) {
                    selectIsland(hitIslandId);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            const time = performance.now() * 0.001;

            // Smooth Camera Interpolation
            camState.theta += (camState.desiredTheta - camState.theta) * 0.08;
            camState.phi += (camState.desiredPhi - camState.phi) * 0.08;
            camState.radius += (camState.desiredRadius - camState.radius) * 0.08;
            camState.targetX += (camState.desiredTargetX - camState.targetX) * 0.08;
            camState.targetY += (camState.desiredTargetY - camState.targetY) * 0.08;
            camState.targetZ += (camState.desiredTargetZ - camState.targetZ) * 0.08;

            camera.position.x = camState.targetX + camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
            camera.position.y = camState.targetY + camState.radius * Math.cos(camState.phi);
            camera.position.z = camState.targetZ + camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);
            camera.lookAt(camState.targetX, camState.targetY, camState.targetZ);

            // Gentle bobbing for active island
            islandGroups.forEach(item => {
                if (item.id === currentIslandId) {
                    item.group.position.y = Math.sin(time * 3) * 0.25 + 0.25;
                } else {
                    item.group.position.y += (0 - item.group.position.y) * 0.1;
                }
            });

            // Animate miniature landmark props
            animatedProps.forEach(p => {
                if (p.type === 'spinBob') {
                    p.mesh.rotation.y = time * 1.2;
                    p.mesh.position.y = p.baseY + Math.sin(time * 2.5) * 0.18;
                } else if (p.type === 'seesaw') {
                    p.mesh.rotation.z = Math.sin(time * 2) * 0.18;
                } else if (p.type === 'wheelSpin') {
                    p.mesh.rotation.z = time * 0.6;
                } else if (p.type === 'pulse') {
                    const s = 1 + Math.sin(time * 2.2) * 0.04;
                    p.mesh.scale.set(s, s, s);
                }
            });

            // Orbit Clouds
            clouds.forEach(c => {
                c.angle += c.speed;
                c.mesh.position.x = Math.cos(c.angle) * c.dist;
                c.mesh.position.z = Math.sin(c.angle) * c.dist;
                c.mesh.position.y = c.baseY + Math.sin(time + c.dist) * 0.2;
                c.mesh.lookAt(0, c.mesh.position.y, 0);
            });

            renderer.render(scene, camera);
            updateHTMLIslandLabels();
        }

        /********************************************************************
         * 3. NAVIGATION, RESPONSIVE UI & CAMERA FOCUS LOGIC
         ********************************************************************/
        function selectIsland(id) {
            const isl = ISLANDS_DATA.find(x => x.id === id);
            if (!isl) return;

            currentIslandId = id;
            currentTabId = isl.tabs[0].id;
            visitedIslands.add(id);
            updateVisitedProgress();

            // Hide initial welcome banner
            const hint = document.getElementById('welcome-hint');
            if (hint) hint.style.opacity = '0';

            // Focus 3D Camera on selected island (offset slightly on desktop so island shows on the left while drawer is on the right)
            const isDesktop = window.innerWidth >= 768;
            camState.desiredTargetX = isl.pos.x + (isDesktop ? 3.5 : 0);
            camState.desiredTargetZ = isl.pos.z;
            camState.desiredRadius = isDesktop ? 19 : 24;
            camState.desiredPhi = 0.82;

            // Highlight Dock Button
            document.querySelectorAll('.dock-btn').forEach(btn => {
                btn.classList.remove('bg-toy-navy', 'text-white', 'ring-2', 'ring-toy-navy');
            });
            const activeDockBtn = document.getElementById(`dock-btn-${id}`);
            if (activeDockBtn) {
                activeDockBtn.classList.add('bg-toy-navy', 'text-white');
            }

            // Open & Render Drawer
            isDrawerOpen = true;
            isDrawerMinimized = false;
            updateDrawerVisibility();
            renderDrawerHeaderAndTabs(isl);
            renderIslandTabContent(id, currentTabId);
        }

        function updateVisitedProgress() {
            document.getElementById('visited-count').textContent = visitedIslands.size;
            visitedIslands.forEach(id => {
                const check = document.getElementById(`label-check-${id}`);
                if (check) check.classList.remove('hidden');
            });
        }

        function resetCameraView() {
            const isMobile = window.innerWidth < 768;
            camState.desiredTargetX = 0;
            camState.desiredTargetY = 0;
            camState.desiredTargetZ = 0;
            camState.desiredRadius = isMobile ? 36 : 30;
            camState.desiredPhi = 0.88;
            camState.desiredTheta = 0.45;
        }

        function closeDrawerToOverview() {
            isDrawerOpen = false;
            isDrawerMinimized = false;
            currentIslandId = null;
            updateDrawerVisibility();
            resetCameraView();
        }

        function minimizeDrawer() {
            isDrawerMinimized = true;
            updateDrawerVisibility();
            // Center camera right on the island so user can admire the 3D toy model unobstructed
            if (currentIslandId) {
                const isl = ISLANDS_DATA.find(x => x.id === currentIslandId);
                camState.desiredTargetX = isl.pos.x;
                camState.desiredTargetZ = isl.pos.z;
                camState.desiredRadius = 16;
            }
        }

        function restoreDrawer() {
            if (!currentIslandId) {
                selectIsland(1);
                return;
            }
            isDrawerMinimized = false;
            isDrawerOpen = true;
            updateDrawerVisibility();
        }

        function toggleMainPanel() {
            if (!currentIslandId) {
                selectIsland(1);
                return;
            }
            if (isDrawerOpen && !isDrawerMinimized) {
                minimizeDrawer();
            } else {
                restoreDrawer();
            }
        }

        function updateDrawerVisibility() {
            const drawer = document.getElementById('content-drawer');
            const pill = document.getElementById('minimized-pill');
            const toggleIcon = document.getElementById('toggle-panel-icon');
            const toggleText = document.getElementById('toggle-panel-text');

            if (isDrawerOpen && !isDrawerMinimized) {
                drawer.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
                drawer.classList.add('opacity-100', 'translate-y-0');
                pill.classList.add('hidden');
                toggleIcon.className = 'fa-solid fa-eye-slash';
                toggleText.textContent = '收起面板看3D';
            } else if (isDrawerOpen && isDrawerMinimized) {
                drawer.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
                drawer.classList.remove('opacity-100', 'translate-y-0');
                pill.classList.remove('hidden');
                const isl = ISLANDS_DATA.find(x => x.id === currentIslandId);
                document.getElementById('minimized-pill-text').textContent = `展開「${isl ? isl.name : '學習面板'}」`;
                toggleIcon.className = 'fa-solid fa-book-open';
                toggleText.textContent = '展開學習內容';
            } else {
                drawer.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
                drawer.classList.remove('opacity-100', 'translate-y-0');
                pill.classList.add('hidden');
                toggleIcon.className = 'fa-solid fa-play';
                toggleText.textContent = '開啟學習島嶼';
            }
        }

        function navigateAdjacentIsland(dir) {
            let nextId = (currentIslandId || 1) + dir;
            if (nextId < 1) nextId = 6;
            if (nextId > 6) nextId = 1;
            selectIsland(nextId);
        }

            const tabsContainer = document.getElementById('drawer-tabs');
            tabsContainer.innerHTML = isl.tabs.map(t => {
                const active = t.id === currentTabId;

                        story: "三年前中三的美兒與師兄子傑成為戀人。子傑升讀大學後甚少聯絡美兒，一直不聽她的電話。美兒看到子傑社交媒體常出現同一名女子。一天晚上，美兒獨自在海灘散心時打電話給子傑，子傑接聽後說：「不必多說了，我們分手吧。對不起！我發覺我們再沒有共同話題，我在享受大學生活，你則要專注應付文憑試。兩個月前你生日在我們第一次約會的餐廳，我實在不忍心提出分手。」美兒憤怒大喊：「你在大學另結新歡了吧！我不想聽！」隨即掛線。",
                        items: [
                            {
                                dim: "時（日子與時機）",
                                q: "子傑在「時」的處理上有哪些妥善與不妥之處？",
                                isGood: false,
                                goodPt: "子傑兩個月前已有冷淡先兆，且避免在美兒生日當天提出分手。",
                                badPt: "子傑一直不聽美兒電話，以逃避聯絡的方式拖延分手；且在晚上美兒情緒低落時才在電話中草率提出。",
                                improve: "子傑不應以失去聯絡逃避談判，應主動約定合適的日間時間當面溝通。"
                            },
                            {
                                dim: "地（分手地點）",
                                q: "在「美兒晚上獨自一人在海灘」時透過電話談分手是否妥善？",
                                isGood: false,
                                goodPt: "子傑避開了第一次約會的紀念餐廳。",
                                badPt: "透過電話提出分手未能觀察及照顧美兒的即時安全；美兒當時「晚上獨自在偏僻海灘」，情緒激動下極可能發生危險！",
                                improve: "應約在日間、熟悉的公共場所（如安靜的餐廳）當面提出，以保障雙方人身安全為首要前提。"
                            },
                            {
                                dim: "人（雙方態度）",
                                q: "子傑與美兒在「人（態度）」方面表現如何？",
                                isGood: false,
                                goodPt: "子傑有說「對不起」表達歉意。",
                                badPt: "子傑起初說「不必多說了」態度敷衍；美兒則十分激動憤怒，拒絕聆聽並立即掛線。",
                                improve: "子傑應以誠懇負責任的態度主動溝通並肯定過去付出；美兒應保持理性克制，先離開海灘返回安全地方並冷靜聆聽。"
                            },
                            {
                                dim: "事（原因與方式）",
                                q: "在「事（原因與方式）」方面應如何改善？",
                                isGood: false,
                                goodPt: "子傑在美兒追問下有交代原因（沒有共同話題、各自需專注大學與文憑試）。",
                                badPt: "以電話被動交代及美兒掛線收場，雙方未能好好完成告別，造成較大心理傷害。",
                                improve: "雙方應當面確認關係無法維持，子傑應溫和清晰地交代真實原因，將傷害減至最低。"
                            }
                        ]
                    }
                };

                const activeCaseObj = cases[island5ActiveCase];

                container.innerHTML = `
                    <!-- Switch between Case 1 and Case 2 -->
                    <div class="flex gap-2">
                        <button onclick="switchIsland5Case('case1')" class="flex-1 py-2 px-3 rounded-xl font-black text-xs border-2 border-toy-navy ${island5ActiveCase==='case1' ? 'bg-purple-600 text-white' : 'bg-white text-toy-navy'}">
                            🎡 個案一：紫晴與展緯 (P.26)
                        </button>
                        <button onclick="switchIsland5Case('case2')" class="flex-1 py-2 px-3 rounded-xl font-black text-xs border-2 border-toy-navy ${island5ActiveCase==='case2' ? 'bg-purple-600 text-white' : 'bg-white text-toy-navy'}">
                            🏖️ 個案二：美兒與子傑 (P.27)
                        </button>
                    </div>

                    <div class="p-3.5 rounded-2xl border-2 border-toy-navy bg-purple-50 text-xs md:text-sm space-y-1.5">
                        <div class="font-black text-purple-950">${activeCaseObj.title}</div>
                        <p class="text-slate-700 leading-relaxed bg-white p-3 rounded-xl border border-purple-200">${activeCaseObj.story}</p>
                    </div>

                    <div class="space-y-3">
                        ${activeCaseObj.items.map((it, idx) => {
                            const key = `${island5ActiveCase}_${idx}`;
                            const revealed = island5CaseChecks[key];
                            return `
                                <div class="p-3.5 rounded-2xl border-2 border-toy-navy bg-white space-y-2">
                                    <div class="flex items-center justify-between">
                                        <span class="font-black text-xs md:text-sm text-purple-800">【${it.dim}】</span>
                                        <button onclick="revealIsland5Dim('${key}')" class="toy-btn bg-toy-yellow text-toy-navy px-3 py-1 rounded-xl text-xs font-black">
                                            ${revealed ? '✔ 已展開診斷分析' : '🔍 點擊評估妥善與改善方法'}
                                        </button>
                                    </div>
                                    <p class="text-xs text-slate-600 font-medium">${it.q}</p>
                                    ${revealed ? `
                                        <div class="space-y-1.5 pt-1 text-xs border-t border-slate-200">
                                            <div class="p-2 rounded-lg bg-emerald-50 text-emerald-950"><strong>✔ 妥善之處：</strong>${it.goodPt}</div>
                                            <div class="p-2 rounded-lg bg-rose-50 text-rose-950"><strong>✘ 有待改善之處：</strong>${it.badPt}</div>
                                            <div class="p-2 rounded-lg bg-amber-50 text-amber-950 border border-amber-300"><strong>💡 改善建議：</strong>${it.improve}</div>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function switchIsland5Case(cKey) {
            island5ActiveCase = cKey;
            renderIslandTabContent(5, "casegame");
        }

        function revealIsland5Dim(key) {
            island5CaseChecks[key] = !island5CaseChecks[key];
            renderIslandTabContent(5, "casegame");
        }

        /* ================= ISLAND 6: 30題終極測試站 ================= */
        function renderIsland6(container, tabId) {
            const answeredCount = userQuizAnswers.filter(x => x !== null).length;
            const correctCount = userQuizAnswers.reduce((acc, ans, idx) => acc + (ans === QUIZ_QUESTIONS[idx].ans ? 1 : 0), 0);

            if (tabId === "quiz") {
                const qObj = QUIZ_QUESTIONS[currentQuizIndex];
                const selectedAns = userQuizAnswers[currentQuizIndex];
                const isAnswered = selectedAns !== null;

                container.innerHTML = `
                    <!-- Score & Progress Header -->
                    <div class="p-3.5 rounded-2xl border-2 border-toy-navy bg-orange-50 flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <div class="text-xs font-bold text-orange-900">🏆 戀愛認知 30 題認證測驗</div>
                            <div class="text-sm md:text-base font-black text-toy-navy">
                                已作答：<span class="text-orange-600">${answeredCount}/30</span> 題 ｜ 目前得分：<span class="text-emerald-600">${correctCount}</span> / 30
                            </div>
                        </div>
                        <button onclick="resetQuizAll()" class="toy-btn bg-white hover:bg-rose-50 text-rose-600 px-3 py-1 rounded-xl text-xs font-black">
                            <i class="fa-solid fa-rotate-right mr-1"></i>重新測驗
                        </button>
                    </div>

                    <!-- Question Number Quick Grid -->
                    <div class="flex gap-1 overflow-x-auto py-1 no-scrollbar">
                        ${QUIZ_QUESTIONS.map((_, idx) => {
                            const ua = userQuizAnswers[idx];
                            let bg = "bg-white text-slate-700 border-slate-300";
                            if (ua !== null) {
                                bg = (ua === QUIZ_QUESTIONS[idx].ans) ? "bg-emerald-500 text-white border-toy-navy" : "bg-rose-500 text-white border-toy-navy";
                            }
                            if (idx === currentQuizIndex) {
                                bg += " ring-2 ring-toy-navy scale-105";
                            }
                            return `
                                <button onclick="jumpToQuiz(${idx})" class="w-7 h-7 rounded-lg text-[11px] font-black border flex-shrink-0 transition-all ${bg}">
                                    ${idx + 1}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- Current Question Card -->
                    <div class="p-4 md:p-5 rounded-2xl border-2 border-toy-navy bg-white shadow space-y-3">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-500">
                            <span>第 ${currentQuizIndex + 1} / 30 題</span>
                            <span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800">
                                ${currentQuizIndex < 7 ? '單元1：何謂戀愛' : currentQuizIndex < 13 ? '單元2：友誼與戀愛' : currentQuizIndex < 19 ? '單元3：目的與態度' : currentQuizIndex < 24 ? '單元4：結束因素' : '單元5：恰當處理方法'}
                            </span>
                        </div>

                        <h3 class="font-black text-sm md:text-base text-toy-navy leading-relaxed">${qObj.q}</h3>

                        <div class="space-y-2 pt-1">
                            ${qObj.options.map((opt, oIdx) => {
                                let btnStyle = "bg-slate-50 hover:bg-orange-50 border-slate-300 text-toy-navy";
                                if (isAnswered) {
                                    if (oIdx === qObj.ans) {
                                        btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-950 font-black";
                                    } else if (oIdx === selectedAns && selectedAns !== qObj.ans) {
                                        btnStyle = "bg-rose-100 border-rose-500 text-rose-950 font-black";
                                    } else {
                                        btnStyle = "bg-slate-50 border-slate-200 text-slate-400";
                                    }
                                }
                                return `
                                    <button onclick="selectQuizOption(${oIdx})"
                                        class="w-full text-left p-3 rounded-xl border-2 text-xs md:text-sm transition-all flex items-start gap-2.5 ${btnStyle}">
                                        <span class="w-6 h-6 rounded-lg bg-white border border-toy-navy flex items-center justify-center font-black text-xs flex-shrink-0">
                                            ${['A', 'B', 'C', 'D'][oIdx]}
                                        </span>
                                        <span class="flex-1 leading-relaxed">${opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${isAnswered ? `
                            <div class="p-3.5 rounded-xl border-2 text-xs md:text-sm leading-relaxed ${selectedAns === qObj.ans ? 'bg-emerald-50 border-emerald-400 text-emerald-950' : 'bg-rose-50 border-rose-400 text-rose-950'}">
                                <div class="font-black mb-1">
                                    ${selectedAns === qObj.ans ? '🎉 答對了！太棒了！' : `💡 答錯了！正確答案是 (${['A','B','C','D'][qObj.ans]})`}
                                </div>
                                <div><strong>詳解：</strong>${qObj.exp}</div>
                            </div>
                        ` : ''}

                        <!-- Prev / Next Question Buttons -->
                        <div class="flex items-center justify-between pt-2">
                            <button onclick="jumpToQuiz(${Math.max(0, currentQuizIndex - 1)})" ${currentQuizIndex === 0 ? 'disabled' : ''}
                                class="toy-btn bg-white disabled:opacity-40 text-toy-navy px-3.5 py-1.5 rounded-xl text-xs font-black">
                                ⬅ 上一題
                            </button>
                            <button onclick="jumpToQuiz(${Math.min(QUIZ_QUESTIONS.length - 1, currentQuizIndex + 1)})" ${currentQuizIndex === QUIZ_QUESTIONS.length - 1 ? 'disabled' : ''}
                                class="toy-btn bg-orange-500 disabled:opacity-40 text-white px-4 py-1.5 rounded-xl text-xs font-black">
                                下一題 ➔
                            </button>
                        </div>
                    </div>
                `;
            } else if (tabId === "review") {
                container.innerHTML = `
                    <div class="bg-orange-50 border-2 border-orange-300 rounded-2xl p-3 text-xs md:text-sm font-bold text-orange-950">
                        📚 30 題完整題庫與詳解温習清單（可隨時點擊題目跳轉作答）：
                    </div>
                    <div class="space-y-2.5">
                        ${QUIZ_QUESTIONS.map((item, idx) => {
                            const ua = userQuizAnswers[idx];
                            return `
                                <div onclick="jumpToQuizFromReview(${idx})" class="p-3 rounded-2xl border-2 border-slate-300 hover:border-toy-navy bg-white cursor-pointer transition-all space-y-1">
                                    <div class="flex items-center justify-between gap-2">
                                        <span class="font-black text-xs text-toy-navy">${item.q}</span>
                                        <span class="text-xs font-black flex-shrink-0 ${ua === null ? 'text-slate-400' : ua === item.ans ? 'text-emerald-600' : 'text-rose-600'}">
                                            ${ua === null ? '未作答' : ua === item.ans ? '✔ 答對' : '✘ 答錯'}
                                        </span>
                                    </div>
                                    <div class="text-xs text-emerald-800 font-bold">正確答案：(${['A','B','C','D'][item.ans]}) ${item.options[item.ans]}</div>
                                    <div class="text-[11px] text-slate-600">${item.exp}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        function selectQuizOption(optIdx) {
            userQuizAnswers[currentQuizIndex] = optIdx;
            renderIslandTabContent(6, "quiz");
        }

        function jumpToQuiz(idx) {
            currentQuizIndex = idx;
            renderIslandTabContent(6, "quiz");
        }

        function jumpToQuizFromReview(idx) {
            currentQuizIndex = idx;
            switchIslandTab("quiz");
        }

        function resetQuizAll() {
            userQuizAnswers = new Array(QUIZ_QUESTIONS.length).fill(null);
            currentQuizIndex = 0;
            renderIslandTabContent(6, "quiz");
        }

        // Start 3D Toy World on Window Load
        window.onload = function () {
            initThreePlayground();
            animateLoop();
        };
    </script>
</body>
</html>
